version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zk
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zk:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"

  postgres:
    image: postgres:15
    container_name: hdqp_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hdqp
      - POSTGRES_USER=hdqp
      - POSTGRES_PASSWORD=hdqp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.2
    container_name: airflow
    depends_on:
      - postgres
      - kafka
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary==2.9.9 kafka-python==2.0.2 pandas==2.2.2 SQLAlchemy==2.0.31 great-expectations==1.2.0 python-dotenv==1.0.1
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./expectations:/opt/airflow/expectations
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/dags/../requirements_airflow.txt || true &&
               airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow webserver &
               airflow scheduler"
    ports:
      - "8080:8080"

volumes:
  pgdata:
